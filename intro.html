<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGUYEN DUCC | Welcome</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        /* =========================================================
           RESET + COLORS
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #03050d;
            --cyan: #00eaff;
            --blue: #2677ff;
            --pink: #ff3cac;
            --white: #f7fbff;
            --muted: #77839e;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            color: var(--white);
            font-family: "Poppins", sans-serif;
            background: var(--bg);
            transition: opacity .8s ease, transform .8s ease;
        }

        body.exit {
            opacity: 0;
            transform: scale(1.03);
        }


        /* =========================================================
           BACKGROUND
        ========================================================= */

        .scene {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            display: grid;
            place-items: center;
            isolation: isolate;
        }

        .scene::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -3;
            opacity: .24;
            background-image:
                linear-gradient(
                    rgba(0, 234, 255, .04) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(0, 234, 255, .04) 1px,
                    transparent 1px
                );
            background-size: 58px 58px;
            mask-image: linear-gradient(
                to bottom,
                transparent,
                #000 18%,
                #000 82%,
                transparent
            );
        }

        .scene::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -4;
            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(0, 234, 255, .07),
                    transparent 27%
                ),
                radial-gradient(
                    circle at 15% 90%,
                    rgba(255, 60, 172, .06),
                    transparent 24%
                );
        }

        .orb {
            position: absolute;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: .08;
            z-index: -2;
        }

        .orb.cyan {
            top: -220px;
            left: -140px;
            background: var(--cyan);
        }

        .orb.pink {
            right: -200px;
            bottom: -180px;
            background: var(--pink);
        }


        /* =========================================================
           SMALL PARTICLES
        ========================================================= */

        .particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 9px #fff;
            opacity: .45;
            animation: twinkle 2.5s ease-in-out infinite;
        }

        .particle:nth-child(1) {
            top: 18%;
            left: 13%;
        }

        .particle:nth-child(2) {
            top: 27%;
            left: 88%;
            animation-delay: .6s;
        }

        .particle:nth-child(3) {
            top: 76%;
            left: 8%;
            animation-delay: 1.1s;
        }

        .particle:nth-child(4) {
            top: 82%;
            left: 92%;
            animation-delay: 1.8s;
        }

        .particle:nth-child(5) {
            top: 12%;
            left: 55%;
            animation-delay: .3s;
        }

        .particle:nth-child(6) {
            top: 67%;
            left: 72%;
            animation-delay: 1.5s;
        }

        @keyframes twinkle {
            50% {
                transform: scale(2.5);
                opacity: 1;
            }
        }


        /* =========================================================
           TOP BAR
        ========================================================= */

        .topbar {
            position: absolute;
            top: 25px;
            left: 30px;
            right: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #66718a;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .topbar strong {
            color: var(--cyan);
        }

        .live {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22ff9a;
            box-shadow: 0 0 10px #22ff9a;
        }


        /* =========================================================
           HANGING OBJECTS
        ========================================================= */

        .hangers {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .hang {
            --length: 180px;
            --delay: 0s;
            --swing: 5deg;

            position: absolute;
            top: -30px;
            left: 50%;
            width: 1px;
            height: var(--length);
            transform-origin: top center;
            animation:
                hangIn .9s var(--delay) both,
                swing 3.8s var(--delay) ease-in-out infinite;
        }

        .hang-line {
            width: 1px;
            height: calc(var(--length) - 45px);
            background: linear-gradient(
                to bottom,
                transparent,
                rgba(0, 234, 255, .55)
            );
            box-shadow: 0 0 8px rgba(0, 234, 255, .3);
        }

        .hang-dot {
            position: absolute;
            bottom: 39px;
            left: -3px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--cyan);
            box-shadow:
                0 0 10px var(--cyan),
                0 0 25px rgba(0, 234, 255, .6);
        }

        .hang-box {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            transform: translateX(-50%);
            border: 1px solid rgba(0, 234, 255, .28);
            border-radius: 13px;
            color: #d9fbff;
            background: rgba(4, 11, 25, .82);
            box-shadow:
                0 0 20px rgba(0, 234, 255, .1),
                inset 0 0 20px rgba(0, 234, 255, .04);
            backdrop-filter: blur(10px);
            font-size: 14px;
            font-weight: 600;
        }

        .hang.pink .hang-line {
            background: linear-gradient(
                to bottom,
                transparent,
                rgba(255, 60, 172, .55)
            );
        }

        .hang.pink .hang-dot {
            background: var(--pink);
            box-shadow:
                0 0 10px var(--pink),
                0 0 25px rgba(255, 60, 172, .55);
        }

        .hang.pink .hang-box {
            border-color: rgba(255, 60, 172, .3);
            box-shadow:
                0 0 20px rgba(255, 60, 172, .1),
                inset 0 0 20px rgba(255, 60, 172, .04);
        }

        .hang:nth-child(1) {
            left: 7%;
            --length: 165px;
            --delay: .1s;
            --swing: 4deg;
        }

        .hang:nth-child(2) {
            left: 17%;
            --length: 295px;
            --delay: .25s;
            --swing: 6deg;
        }

        .hang:nth-child(3) {
            left: 28%;
            --length: 125px;
            --delay: .4s;
        }

        .hang:nth-child(4) {
            left: 42%;
            --length: 195px;
            --delay: .55s;
        }

        .hang:nth-child(5) {
            left: 58%;
            --length: 110px;
            --delay: .7s;
        }

        .hang:nth-child(6) {
            left: 72%;
            --length: 260px;
            --delay: .85s;
            --swing: 7deg;
        }

        .hang:nth-child(7) {
            left: 83%;
            --length: 150px;
            --delay: 1s;
        }

        .hang:nth-child(8) {
            left: 94%;
            --length: 235px;
            --delay: 1.15s;
        }

        @keyframes hangIn {
            from {
                opacity: 0;
                transform: translateY(-120px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes swing {
            0%, 100% {
                transform: rotate(var(--swing));
            }

            50% {
                transform: rotate(calc(var(--swing) * -1));
            }
        }


        /* =========================================================
           CENTER CONTENT
        ========================================================= */

        .content {
            position: relative;
            z-index: 5;
            width: min(850px, calc(100% - 40px));
            text-align: center;
        }

        .welcome {
            color: var(--cyan);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 7px;
            text-transform: uppercase;
            animation: up .8s ease both;
        }

        .title {
            margin-top: 10px;
            font-size: clamp(46px, 10vw, 100px);
            line-height: .95;
            font-weight: 800;
            letter-spacing: -5px;
            animation: up .9s .12s ease both;
        }

        .title span {
            background: linear-gradient(
                90deg,
                #fff,
                #bafaff,
                var(--cyan),
                #a78bfa,
                #fff
            );
            background-size: 250% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradient 5s linear infinite;
        }

        .tagline {
            margin-top: 18px;
            color: var(--muted);
            font-size: 14px;
            animation: up .9s .25s ease both;
        }

        .tagline b {
            color: #fff;
        }

        @keyframes up {
            from {
                opacity: 0;
                transform: translateY(28px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes gradient {
            to {
                background-position: 250% center;
            }
        }


        /* =========================================================
           TERMINAL
        ========================================================= */

        .terminal-box {
            width: fit-content;
            max-width: 100%;
            margin: 32px auto 0;
            padding: 11px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 10px;
            background: rgba(255, 255, 255, .025);
            color: #b9c4d8;
            font-family: monospace;
            font-size: 13px;
            animation: up .9s .38s ease both;
        }

        .prompt {
            color: var(--cyan);
        }

        .cursor {
            color: var(--pink);
            animation: blink .7s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }


        /* =========================================================
           PROGRESS
        ========================================================= */

        .progress-wrap {
            width: min(360px, 85%);
            margin: 24px auto 0;
            animation: up .9s .5s ease both;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 7px;
            color: #5d6881;
            font-size: 9px;
            letter-spacing: 1.5px;
        }

        .progress-bar {
            height: 3px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(255, 255, 255, .06);
        }

        .progress-fill {
            width: 0;
            height: 100%;
            background: linear-gradient(
                90deg,
                var(--cyan),
                var(--blue),
                var(--pink)
            );
            box-shadow: 0 0 14px rgba(0, 234, 255, .7);
            transition: width .12s linear;
        }

        .footer {
            margin-top: 20px;
            color: #424c63;
            font-size: 10px;
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 600px) {

            .topbar {
                top: 17px;
                left: 18px;
                right: 18px;
                font-size: 8px;
            }

            .hang:nth-child(1),
            .hang:nth-child(3),
            .hang:nth-child(5),
            .hang:nth-child(8) {
                display: none;
            }

            .hang-box {
                width: 39px;
                height: 39px;
                font-size: 12px;
            }

            .title {
                letter-spacing: -3px;
            }

            .welcome {
                letter-spacing: 4px;
            }

            .tagline {
                font-size: 12px;
            }

            .terminal-box {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

    <main class="scene">

        <div class="orb cyan"></div>
        <div class="orb pink"></div>


        <!-- PARTICLES -->

        <div class="particles">
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
        </div>


        <!-- TOP BAR -->

        <header class="topbar">
            <div>
                <strong>NGUYEN DUCC</strong>
                <span> / DIGITAL SPACE</span>
            </div>

            <div class="live">
                <span class="live-dot"></span>
                ONLINE
            </div>
        </header>


        <!-- HANGING ELEMENTS -->

        <div class="hangers">

            <div class="hang">
                <div class="hang-line"></div>
                <div class="hang-dot"></div>
                <div class="hang-box">&lt;/&gt;</div>
            </div>

            <div class="hang pink">
                <div class="hang-line"></div>
                <div class="hang-dot"></div>
                <div class="hang-box">✦</div>
            </div>

            <div class="hang">
                <div class="hang-line"></div>
                <div class="hang-dot"></div>
                <div class="hang-box">{ }</div>
            </div>

            <div class="hang pink">
                <div class="hang-line"></div>
                <div class="hang-dot"></div>
                <div class="hang-box">01</div>
            </div>

            <div class="hang">
                <div class="hang-line"></div>
                <div class="hang-dot"></div>
                <div class="hang-box">+</div>
            </div>

            <div class="hang pink">
                <div class="hang-line"></div>
                <div class="hang-dot"></div>
                <div class="hang-box">✧</div>
            </div>

            <div class="hang">
                <div class="hang-line"></div>
                <div class="hang-dot"></div>
                <div class="hang-box">∞</div>
            </div>

            <div class="hang pink">
                <div class="hang-line"></div>
                <div class="hang-dot"></div>
                <div class="hang-box">*</div>
            </div>

        </div>


        <!-- MAIN -->

        <section class="content">

            <div class="welcome">
                Welcome to my website
            </div>

            <h1 class="title">
                <span>NGUYEN DUCC</span>
            </h1>

            <p class="tagline">
                Developer • Creator •
                <b>Digital Store</b>
            </p>


            <div class="terminal-box">
                <span class="prompt">&gt;_</span>
                <span id="typingText"></span>
                <span class="cursor">▋</span>
            </div>


            <div class="progress-wrap">

                <div class="progress-info">
                    <span>LOADING WEBSITE</span>
                    <span id="progress">0%</span>
                </div>

                <div class="progress-bar">
                    <div
                        class="progress-fill"
                        id="progressFill"
                    ></div>
                </div>

            </div>


            <div class="footer">
                Preparing your experience...
            </div>

        </section>

    </main>


    <script>

        /* =========================================================
           CONFIG
        ========================================================= */

        const TEXT = "nguyenhuuducdepzai";
        const SPEED = 65;
        const WAIT = 900;


        /* =========================================================
           ELEMENTS
        ========================================================= */

        const typingText =
            document.getElementById("typingText");

        const progress =
            document.getElementById("progress");

        const progressFill =
            document.getElementById("progressFill");


        /* =========================================================
           TYPING
        ========================================================= */

        let index = 0;

        function typeText() {

            if (index >= TEXT.length) {
                finishIntro();
                return;
            }

            typingText.textContent +=
                TEXT[index];

            index++;

            const percent =
                Math.round(
                    index / TEXT.length * 100
                );

            progress.textContent =
                percent + "%";

            progressFill.style.width =
                percent + "%";

            setTimeout(
                typeText,
                SPEED
            );
        }


        /* =========================================================
           REDIRECT
        ========================================================= */

        function finishIntro() {

            progress.textContent = "100%";
            progressFill.style.width = "100%";

            setTimeout(() => {

                document.body.classList.add("exit");

                setTimeout(() => {

                    sessionStorage.setItem(
                        "introDone",
                        "true"
                    );

                    window.location.replace(
                        "index.html"
                    );

                }, 800);

            }, WAIT);
        }


        /* =========================================================
           START
        ========================================================= */

        window.addEventListener(
            "load",
            () => {
                setTimeout(
                    typeText,
                    800
                );
            }
        );

    </script>

</body>
</html>
